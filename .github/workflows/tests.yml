# Runs the offline test suites on every push and pull request (no API key or network needed).
# A red X on GitHub means a change broke something - fix it before deploying.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_mm_bot.py
      - run: python tests/test_ref_prices.py
      - run: python tests/test_stress.py        # randomised: a flaky exchange, 5 simulated sessions

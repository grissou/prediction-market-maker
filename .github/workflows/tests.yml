# Runs every offline test suite on each push and pull request (no API key or network needed).
# A red X on GitHub means a change broke something - fix it before deploying.
# Python 3.10, the version the live server runs. The dry-run suites (tests/test_p*_dryrun.py) need a recorded
# snapshot (P9_SNAP) and skip without one.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: all suites
        run: |
          status=0
          for t in tests/test_*.py; do
            out=$(python "$t" 2>&1) || { status=1; echo "FAILED $t"; echo "$out" | tail -20; }
            echo "$t: $(echo "$out" | tail -1)"
          done
          exit $status
      - run: STRESS_LADDER=1 python tests/test_stress.py
